<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="13" role="img" aria-label="长期凭证离 JS 越远，XSS 能带走的就越少">
  <title>长期凭证离 JS 越远，XSS 能带走的就越少</title>
  <rect x="0.5" y="0.5" width="759" height="431" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">长期凭证离 JS 越远，XSS 能带走的就越少</text>
  <text x="24" y="54" font-size="11.5" fill="#6b7280">同一次登录，四种做法下凭证分别放在哪里</text>

  <!-- 列标题 -->
  <g text-anchor="middle">
    <text x="213.5" y="94" font-weight="600" fill="#1f2328">双 Token</text>
    <text x="213.5" y="112" font-size="11.5" fill="#6b7280">常见 SPA 做法</text>
    <text x="364.5" y="94" font-weight="600" fill="#1f2328">轻量版</text>
    <text x="364.5" y="112" font-size="11.5" fill="#6b7280">refresh 进 Cookie</text>
    <text x="515.5" y="94" font-weight="600" fill="#1f2328">方案 A</text>
    <text x="515.5" y="112" font-size="11.5" fill="#6b7280">Session + Cookie</text>
    <text x="666.5" y="94" font-weight="600" fill="#1f2328">方案 B</text>
    <text x="666.5" y="112" font-size="11.5" fill="#6b7280">BFF 代管 token</text>
  </g>

  <!-- 行 1：JS 能读到 -->
  <rect x="16" y="128" width="728" height="96" rx="10" fill="#fff6e5"/>
  <text x="32" y="160" font-weight="600" fill="#b45309">JS 能读到</text>
  <text x="32" y="178" font-size="11.5" fill="#6b7280">localStorage 等</text>
  <text x="32" y="196" font-size="11.5" fill="#b45309">XSS 可以带走</text>

  <!-- 行 2：JS 读不到 -->
  <rect x="16" y="232" width="728" height="72" rx="10" fill="#f6f8fa"/>
  <text x="32" y="264" font-weight="600" fill="#1f2328">JS 读不到</text>
  <text x="32" y="282" font-size="11.5" fill="#6b7280">HttpOnly Cookie</text>

  <!-- 行 3：服务端 -->
  <rect x="16" y="312" width="728" height="96" rx="10" fill="#f6f8fa"/>
  <text x="32" y="356" font-weight="600" fill="#1f2328">服务端</text>
  <text x="32" y="374" font-size="11.5" fill="#6b7280">会话存储 / BFF</text>

  <!-- 暴露给 JS 的凭证 -->
  <g fill="#ffffff" stroke="#e8a33d" stroke-width="1.25">
    <rect x="156" y="145" width="115" height="26" rx="6"/>
    <rect x="156" y="181" width="115" height="26" rx="6"/>
    <rect x="307" y="163" width="115" height="26" rx="6"/>
  </g>
  <g text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#92400e">
    <text x="213.5" y="162">access_token</text>
    <text x="213.5" y="198">refresh_token</text>
    <text x="364.5" y="180">access_token</text>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">
    <text x="515.5" y="180">没有凭证</text>
    <text x="666.5" y="180">没有凭证</text>
  </g>

  <!-- JS 读不到、以及留在服务端的凭证 -->
  <g fill="#ffffff" stroke="#9aa1ab" stroke-width="1.25">
    <rect x="307" y="255" width="115" height="26" rx="6"/>
    <rect x="458" y="255" width="115" height="26" rx="6"/>
    <rect x="609" y="255" width="115" height="26" rx="6"/>
    <rect x="458" y="347" width="115" height="26" rx="6"/>
    <rect x="609" y="329" width="115" height="26" rx="6"/>
    <rect x="609" y="365" width="115" height="26" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#1f2328">
    <text x="364.5" y="272" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">refresh_token</text>
    <text x="515.5" y="272">会话 ID</text>
    <text x="666.5" y="272">会话 ID</text>
    <text x="515.5" y="364">会话数据</text>
    <text x="666.5" y="346" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">access_token</text>
    <text x="666.5" y="382" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">refresh_token</text>
  </g>
  <text x="213.5" y="272" text-anchor="middle" font-size="12" fill="#9aa1ab">—</text>
  <g text-anchor="middle" font-size="11.5" fill="#6b7280">
    <text x="213.5" y="364">只负责签发和校验</text>
    <text x="364.5" y="364">只负责签发和校验</text>
  </g>
</svg>
