<svg viewBox="0 0 680 340" width="680" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg{fill:#FAFBFC;stroke:#E3E8EF;stroke-width:1}
    .fr{fill:none;stroke:#9AA6B8;stroke-width:1;stroke-dasharray:4 4;opacity:.75}
    .g{fill:#EAEDF1;stroke:#CDD5DF;stroke-width:1}
    .tl{fill:#E4F1F2;stroke:#0C7A85;stroke-width:1}
    .am{fill:#F5EBDA;stroke:#B5730A;stroke-width:1}
    .ct{fill:#F7E2E0;stroke:#C63F38;stroke-width:1}
    .gd{stroke:#9AA6B8;stroke-width:1;stroke-dasharray:3 4;opacity:.55}
    text{font-family:-apple-system,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
    .t{font-size:13px;font-weight:600;fill:#2A3646}
    .cap{font-size:12px;fill:#6B7789}
    .l{font-size:11px;fill:#6B7789;font-family:ui-monospace,Menlo,Consolas,monospace}
    .lt{font-size:11px;fill:#0A5A63;font-family:ui-monospace,Menlo,Consolas,monospace}
    .la{font-size:11px;fill:#8A5806;font-family:ui-monospace,Menlo,Consolas,monospace}
    .ann{font-size:11px;fill:#6B7789}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6B7789" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
<rect class="bg" x="0.5" y="0.5" width="679" height="339" rx="10"/><text class="t" x="150" y="38" text-anchor="middle" dominant-baseline="central">内容少：弹性卡撑满视口</text><rect class="fr" x="44" y="60" width="252" height="214" rx="6"/><rect class="g" x="54" y="70" width="112" height="40" rx="4"/><rect class="tl" x="54" y="118" width="112" height="146" rx="4"/><text class="lt" x="110" y="191" text-anchor="middle" dominant-baseline="central">flex:1</text><rect class="g" x="174" y="70" width="112" height="54" rx="4"/><rect class="g" x="174" y="132" width="112" height="42" rx="4"/><rect class="tl" x="174" y="182" width="112" height="82" rx="4"/><text class="lt" x="230" y="223" text-anchor="middle" dominant-baseline="central">flex:1</text><text class="cap" x="150" y="292" text-anchor="middle" dominant-baseline="central">剩余高度由弹性卡吸收，正好铺满</text><text class="t" x="528" y="38" text-anchor="middle" dominant-baseline="central">内容多：整页滚动，底部仍对齐</text><rect class="fr" x="384" y="60" width="252" height="176" rx="6"/><text class="ann" x="398" y="72" text-anchor="start" dominant-baseline="central">视口</text><rect class="g" x="394" y="80" width="112" height="56" rx="4"/><rect class="g" x="394" y="142" width="112" height="52" rx="4"/><rect class="tl" x="394" y="200" width="112" height="100" rx="4"/><rect class="g" x="514" y="80" width="112" height="44" rx="4"/><rect class="g" x="514" y="130" width="112" height="48" rx="4"/><rect class="g" x="514" y="184" width="112" height="42" rx="4"/><rect class="tl" x="514" y="232" width="112" height="68" rx="4"/><line class="gd" x1="384" y1="236" x2="636" y2="236" /><text class="ann" x="632" y="236" text-anchor="end" dominant-baseline="central">视口下缘</text><line x1="628" y1="248" x2="628" y2="292" stroke="#6B7789" stroke-width="1.2" marker-end="url(#ar)"/><text class="ann" x="620" y="270" text-anchor="end" dominant-baseline="central">滚动</text><text class="cap" x="528" y="320" text-anchor="middle" dominant-baseline="central">内容超出视口 → 整页滚动；两列等高，底边对齐不变</text></svg>