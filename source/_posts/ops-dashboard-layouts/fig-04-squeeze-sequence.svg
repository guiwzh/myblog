<svg viewBox="0 0 680 360" width="680" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg{fill:#FAFBFC;stroke:#E3E8EF;stroke-width:1}
    .fr{fill:none;stroke:#9AA6B8;stroke-width:1;stroke-dasharray:4 4;opacity:.75}
    .g{fill:#EAEDF1;stroke:#CDD5DF;stroke-width:1}
    .tl{fill:#E4F1F2;stroke:#0C7A85;stroke-width:1}
    .am{fill:#F5EBDA;stroke:#B5730A;stroke-width:1}
    .ct{fill:#F7E2E0;stroke:#C63F38;stroke-width:1}
    .gd{stroke:#9AA6B8;stroke-width:1;stroke-dasharray:3 4;opacity:.55}
    text{font-family:-apple-system,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
    .t{font-size:13px;font-weight:600;fill:#2A3646}
    .cap{font-size:12px;fill:#6B7789}
    .l{font-size:11px;fill:#6B7789;font-family:ui-monospace,Menlo,Consolas,monospace}
    .lt{font-size:11px;fill:#0A5A63;font-family:ui-monospace,Menlo,Consolas,monospace}
    .la{font-size:11px;fill:#8A5806;font-family:ui-monospace,Menlo,Consolas,monospace}
    .ann{font-size:11px;fill:#6B7789}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6B7789" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
<rect class="bg" x="0.5" y="0.5" width="679" height="359" rx="10"/><text class="t" x="152" y="58" text-anchor="middle" dominant-baseline="central">窗口较高</text><rect class="fr" x="76" y="76" width="152" height="210" rx="6"/><rect class="g" x="84" y="84" width="136" height="30" rx="4"/><text class="l" x="152" y="99" text-anchor="middle" dominant-baseline="central">fixed</text><rect class="am" x="84" y="120" width="136" height="64" rx="4"/><text class="la" x="152" y="152" text-anchor="middle" dominant-baseline="central">shrink</text><rect class="tl" x="84" y="190" width="136" height="88" rx="4"/><text class="lt" x="152" y="234" text-anchor="middle" dominant-baseline="central">fill = 剩余</text><text class="cap" x="152" y="300" text-anchor="middle" dominant-baseline="central">充裕：剩余全给 fill</text><text class="t" x="340" y="58" text-anchor="middle" dominant-baseline="central">窗口变矮</text><rect class="fr" x="264" y="76" width="152" height="170" rx="6"/><rect class="g" x="272" y="84" width="136" height="30" rx="4"/><text class="l" x="340" y="99" text-anchor="middle" dominant-baseline="central">fixed</text><rect class="am" x="272" y="120" width="136" height="64" rx="4"/><text class="la" x="340" y="152" text-anchor="middle" dominant-baseline="central">shrink 未动</text><rect class="tl" x="272" y="190" width="136" height="48" rx="4"/><text class="lt" x="340" y="214" text-anchor="middle" dominant-baseline="central">fill 变小</text><text class="cap" x="340" y="300" text-anchor="middle" dominant-baseline="central">变矮：先吃 fill 富余</text><text class="t" x="528" y="58" text-anchor="middle" dominant-baseline="central">窗口更矮</text><rect class="fr" x="452" y="76" width="152" height="138" rx="6"/><rect class="g" x="460" y="84" width="136" height="30" rx="4"/><text class="l" x="528" y="99" text-anchor="middle" dominant-baseline="central">fixed</text><rect class="am" x="460" y="120" width="136" height="40" rx="4"/><text class="la" x="528" y="140" text-anchor="middle" dominant-baseline="central">shrink→min</text><rect class="tl" x="460" y="166" width="136" height="40" rx="4"/><text class="lt" x="528" y="186" text-anchor="middle" dominant-baseline="central">fill→min</text><text class="cap" x="528" y="300" text-anchor="middle" dominant-baseline="central">更矮：压 shrink 到底线</text><rect class="g" x="150" y="326" width="12" height="12" rx="4"/><text class="l" x="168" y="332" text-anchor="start" dominant-baseline="central">flex:none</text><rect class="am" x="268" y="326" width="12" height="12" rx="4"/><text class="la" x="286" y="332" text-anchor="start" dominant-baseline="central">flex:0 1 auto · min</text><rect class="tl" x="452" y="326" width="12" height="12" rx="4"/><text class="lt" x="470" y="332" text-anchor="start" dominant-baseline="central">flex:1 1 0 · min</text></svg>